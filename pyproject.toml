[project]
name = "freecut"
version = "0.1.0"
description = "Conversation-driven video editor skill for Claude Code — free local transcription (fork of video-use)"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
# Local Whisper transcription (default backend). Pick one:
#   mlx-whisper is fastest on Apple Silicon.
#   faster-whisper works on Linux / Windows / CPU / NVIDIA.
whisper-mlx = ["mlx-whisper"]
whisper-fast = ["faster-whisper"]
animations = ["manim"]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast isolated behavior tests",
    "integration: tests that run ffmpeg/ffprobe against generated media",
    "omnivoice: opt-in tests that invoke a real OmniVoice installation",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
